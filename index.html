<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixelCut Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-mark">P</div>
          <div>
            <p class="eyebrow">Editor Suite</p>
            <h1>PixelCut</h1>
          </div>
        </div>

        <label class="upload-btn" for="imageUpload">
          <span>＋</span>
          Upload Photo
        </label>
        <input id="imageUpload" type="file" accept="image/*" />

        <nav class="tool-tabs">
          <button class="tab active" data-panel="adjustments">Adjust</button>
          <button class="tab" data-panel="effects">Effects</button>
          <button class="tab" data-panel="text">Text</button>
          <button class="tab" data-panel="sticker">Stickers</button>
        </nav>

        <section class="panel active" id="adjustments">
          <div class="slider-group">
            <label for="brightness">Brightness <span id="brightnessValue">100%</span></label>
            <input id="brightness" type="range" min="0" max="200" value="100" />
          </div>

          <div class="slider-group">
            <label for="contrast">Contrast <span id="contrastValue">100%</span></label>
            <input id="contrast" type="range" min="0" max="200" value="100" />
          </div>

          <div class="slider-group">
            <label for="saturation">Saturation <span id="saturationValue">100%</span></label>
            <input id="saturation" type="range" min="0" max="200" value="100" />
          </div>

          <div class="slider-group">
            <label for="blur">Blur <span id="blurValue">0px</span></label>
            <input id="blur" type="range" min="0" max="12" value="0" />
          </div>

          <div class="slider-group">
            <label for="rotate">Rotate <span id="rotateValue">0°</span></label>
            <input id="rotate" type="range" min="-180" max="180" value="0" />
          </div>
        </section>

        <section class="panel" id="effects">
          <div class="preset-grid">
            <button class="preset active" data-preset="original">Original</button>
            <button class="preset" data-preset="warm">Warm</button>
            <button class="preset" data-preset="vintage">Vintage</button>
            <button class="preset" data-preset="cinematic">Cinematic</button>
            <button class="preset" data-preset="cool">Cool</button>
            <button class="preset" data-preset="mono">Mono</button>
          </div>
        </section>

        <section class="panel" id="text">
          <label class="field-label" for="textInput">Text overlay</label>
          <input id="textInput" type="text" placeholder="Type something..." maxlength="40" />

          <div class="color-row">
            <label class="field-label" for="textColor">Color</label>
            <input id="textColor" type="color" value="#ffffff" />
          </div>

          <div class="slider-group compact">
            <label for="fontSize">Font size <span id="fontSizeValue">48</span></label>
            <input id="fontSize" type="range" min="18" max="96" value="48" />
          </div>
        </section>

        <section class="panel" id="sticker">
          <div class="sticker-grid">
            <button class="sticker" data-sticker="✨">✨</button>
            <button class="sticker" data-sticker="⭐">⭐</button>
            <button class="sticker" data-sticker="❤️">❤️</button>
            <button class="sticker" data-sticker="🌈">🌈</button>
            <button class="sticker" data-sticker="💎">💎</button>
            <button class="sticker" data-sticker="🎉">🎉</button>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="file-info">
            <span class="status-dot"></span>
            <span>Unsaved project</span>
          </div>

          <div class="top-actions">
            <button class="secondary" id="resetBtn">Reset</button>
            <button class="primary" id="downloadBtn">Download</button>
          </div>
        </header>

        <div class="canvas-stage">
          <div class="canvas-wrap">
            <canvas id="editorCanvas" width="1100" height="820"></canvas>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
